<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LeRoss Bakery — Menú & Pedidos</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://img.icons8.com/cotton/128/cupcake--v1.png">

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#E5839B',
              darkPink: '#D46B84',
              softPink: '#FFF0F4',
              softBg: '#FBF8F9',
              charcoal: '#1A1A1A',
              border: '#EFE5E9',
              card: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4cZCLRyRizzk671J35-WX1PxnrJ5_kHo",
      authDomain: "le-ross-8d008.firebaseapp.com",
      projectId: "le-ross-8d008",
      storageBucket: "le-ross-8d008.firebasestorage.app",
      messagingSenderId: "343832148201",
      appId: "1:343832148201:web:efdd989e899f3186cf5878"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      }
    } catch (err) {
      console.error("Firebase init error:", err);
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #FBF8F9;
      color: #1A1A1A;
    }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="selection:bg-brand-pink/20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const WHATSAPP_PHONE = "18494411315";
    const formatRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 0, maximumFractionDigits: 0 });

    function MenuApp() {
      const [products, setProducts] = useState([]);
      const [cart, setCart] = useState({});
      const [selectedCategory, setSelectedCategory] = useState("Todos");
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [orderSubmitted, setOrderSubmitted] = useState(false);
      const [whatsAppUrl, setWhatsAppUrl] = useState("");

      // Formulario de Pedido
      const [customerName, setCustomerName] = useState("");
      const [customerPhone, setCustomerPhone] = useState("");
      const [deliveryType, setDeliveryType] = useState("Pickup"); // Pickup o Delivery
      const [deliveryAddress, setDeliveryAddress] = useState("");
      const [deliveryDate, setDeliveryDate] = useState("");
      const [deliveryTime, setDeliveryTime] = useState("");
      const [specialNotes, setSpecialNotes] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        if (!db) return;
        const unsubscribe = db.collection("leross_app").doc("main_data").onSnapshot(
          (doc) => {
            if (doc.exists) {
              const res = doc.data();
              setProducts(res.products || []);
            }
          },
          (err) => console.error("Firestore read error:", err)
        );
        return () => unsubscribe();
      }, []);

      const categories = useMemo(() => {
        const set = new Set(["Todos"]);
        products.forEach(p => {
          if (p.category) set.add(p.category);
        });
        return Array.from(set);
      }, [products]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (p.available === false) return false;
          if (selectedCategory === "Todos") return true;
          return p.category === selectedCategory;
        });
      }, [products, selectedCategory]);

      const addToCart = (product) => {
        setCart(prev => {
          const currentQty = prev[product.id]?.quantity || 0;
          return {
            ...prev,
            [product.id]: {
              product,
              quantity: currentQty + 1
            }
          };
        });
      };

      const updateQuantity = (productId, delta) => {
        setCart(prev => {
          const current = prev[productId];
          if (!current) return prev;
          const newQty = current.quantity + delta;
          if (newQty <= 0) {
            const copy = { ...prev };
            delete copy[productId];
            return copy;
          }
          return {
            ...prev,
            [productId]: {
              ...current,
              quantity: newQty
            }
          };
        });
      };

      const cartItems = Object.values(cart);
      const totalItemsCount = cartItems.reduce((acc, it) => acc + it.quantity, 0);
      const cartSubtotal = cartItems.reduce((acc, it) => acc + (it.product.price * it.quantity), 0);

      const handleSubmitOrder = async (e) => {
        e.preventDefault();
        if (cartItems.length === 0) return alert("Tu carrito está vacío.");
        if (!customerName.trim()) return alert("Por favor ingresa tu nombre.");
        if (!customerPhone.trim()) return alert("Por favor ingresa tu WhatsApp.");
        if (!deliveryDate) return alert("Selecciona la fecha de entrega.");

        setIsSubmitting(true);

        const newOrder = {
          id: "WEB-" + Math.floor(1000 + Math.random() * 9000),
          createdAt: new Date().toISOString(),
          customerName: customerName.trim(),
          customerPhone: customerPhone.trim(),
          deliveryType,
          deliveryAddress: deliveryType === "Delivery" ? deliveryAddress.trim() : "Retiro en Santo Domingo Este",
          deliveryDate,
          deliveryTime,
          specialNotes: specialNotes.trim(),
          items: cartItems.map(it => ({
            id: it.product.id,
            name: it.product.name,
            quantity: it.quantity,
            price: it.product.price,
            total: it.product.price * it.quantity
          })),
          subtotal: cartSubtotal,
          status: "Pendiente"
        };

        // Redactar mensaje de WhatsApp
        let msg = `*¡Hola LeRoss Bakery! Deseo realizar un pedido* 🧁\n\n`;
        msg += `👤 *Cliente:* ${newOrder.customerName}\n`;
        msg += `📱 *WhatsApp:* ${newOrder.customerPhone}\n`;
        msg += `📦 *Modalidad:* ${newOrder.deliveryType === 'Pickup' ? 'Retiro en Santo Domingo Este' : 'Envío a Domicilio'}\n`;
        if (newOrder.deliveryType === 'Delivery' && newOrder.deliveryAddress) {
          msg += `📍 *Dirección:* ${newOrder.deliveryAddress}\n`;
        }
        msg += `📅 *Fecha:* ${newOrder.deliveryDate} ${newOrder.deliveryTime ? '• ' + newOrder.deliveryTime : ''}\n\n`;
        msg += `*Detalle del Pedido:*\n`;
        newOrder.items.forEach(it => {
          msg += `• ${it.quantity}x ${it.name} — ${formatRD(it.total)}\n`;
        });
        msg += `\n💰 *Total Estimado:* ${formatRD(newOrder.subtotal)}\n`;
        if (newOrder.specialNotes) {
          msg += `📝 *Nota especial:* ${newOrder.specialNotes}\n`;
        }
        msg += `\n_Orden generada desde lerossbakery.github.io/LeRoss-Menu_`;

        const waLink = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
        setWhatsAppUrl(waLink);

        // Guardar orden en Firebase para que LeRoss-Facturas la detecte
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").set({
              webOrders: firebase.firestore.FieldValue.arrayUnion(newOrder)
            }, { merge: true });
          }
        } catch (err) {
          console.error("Error guardando orden web en Firebase:", err);
        }

        setIsSubmitting(false);
        setOrderSubmitted(true);
      };

      return (
        <div className="max-w-xl mx-auto min-h-screen pb-32">
          
          {/* Barra Superior de Ubicación */}
          <div className="bg-brand-charcoal text-white text-[11px] py-1.5 px-4 text-center font-semibold tracking-wide flex items-center justify-center space-x-1.5">
            <span>📍</span>
            <span>Santo Domingo Este, República Dominicana</span>
            <span className="text-white/40">•</span>
            <span className="text-brand-pink font-bold">Pedidos con 36h de anticipación</span>
          </div>

          {/* Encabezado Principal */}
          <header className="px-5 pt-6 pb-4 border-b border-brand-border bg-white text-center space-y-1.5">
            <div className="w-12 h-12 mx-auto rounded-2xl bg-brand-softPink flex items-center justify-center border border-brand-pink/30 shadow-xs mb-2">
              <span className="text-2xl">🧁</span>
            </div>
            <h1 className="text-2xl font-black tracking-tight text-brand-charcoal">LeRoss Bakery</h1>
            <p className="text-xs text-gray-500 font-medium">
              Repostería artesanal horneada con amor · Santo Domingo Este
            </p>
          </header>

          {/* Selector de Categorías */}
          {categories.length > 1 && (
            <div className="px-4 py-3 flex space-x-2 overflow-x-auto no-scrollbar border-b border-brand-border/60 bg-white sticky top-0 z-20 backdrop-blur-md bg-white/95">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                    selectedCategory === cat
                      ? "bg-brand-pink text-white shadow-xs"
                      : "bg-brand-softBg text-gray-600 hover:bg-brand-softPink hover:text-brand-darkPink border border-brand-border"
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
          )}

          {/* Catálogo de Postres */}
          <main className="p-4 space-y-3">
            {filteredProducts.map(product => {
              const inCartQty = cart[product.id]?.quantity || 0;

              return (
                <div 
                  key={product.id}
                  className="bg-white p-3.5 rounded-3xl border border-brand-border flex items-center space-x-3.5 shadow-2xs hover:border-brand-pink/40 transition-all"
                >
                  {/* Foto del Postre (Optimizada Retina) */}
                  <div className="w-24 h-24 rounded-2xl bg-brand-softBg overflow-hidden flex-shrink-0 border border-brand-border flex items-center justify-center">
                    {product.image ? (
                      <img 
                        src={product.image} 
                        alt={product.name} 
                        className="w-full h-full object-cover"
                        loading="lazy"
                      />
                    ) : (
                      <span className="text-3xl opacity-40">🍰</span>
                    )}
                  </div>

                  {/* Información */}
                  <div className="flex-1 min-w-0">
                    <h3 className="font-bold text-sm text-brand-charcoal truncate">{product.name}</h3>
                    {product.description && (
                      <p className="text-[11px] text-gray-500 line-clamp-2 mt-0.5 leading-snug">
                        {product.description}
                      </p>
                    )}
                    <div className="mt-2 flex items-baseline space-x-1.5">
                      <span className="font-black text-brand-darkPink text-base">
                        {formatRD(product.price)}
                      </span>
                    </div>
                  </div>

                  {/* Botón de Agregar / Control de Cantidad */}
                  <div className="flex-shrink-0">
                    {inCartQty === 0 ? (
                      <button
                        onClick={() => addToCart(product)}
                        className="bg-brand-softPink hover:bg-brand-pink text-brand-darkPink hover:text-white font-black text-xs px-3.5 py-2 rounded-xl border border-brand-pink/30 transition-all shadow-2xs active:scale-95"
                      >
                        + Agregar
                      </button>
                    ) : (
                      <div className="flex items-center space-x-1.5 bg-brand-softBg border border-brand-border rounded-xl p-1">
                        <button
                          onClick={() => updateQuantity(product.id, -1)}
                          className="w-6 h-6 rounded-lg bg-white font-bold text-xs flex items-center justify-center text-gray-600 shadow-2xs"
                        >
                          -
                        </button>
                        <span className="text-xs font-black px-1 text-brand-charcoal">{inCartQty}</span>
                        <button
                          onClick={() => updateQuantity(product.id, 1)}
                          className="w-6 h-6 rounded-lg bg-brand-pink font-bold text-xs flex items-center justify-center text-white shadow-2xs"
                        >
                          +
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {filteredProducts.length === 0 && (
              <div className="text-center py-16 text-gray-400 text-xs">
                No hay productos disponibles en esta categoría en este momento.
              </div>
            )}
          </main>

          {/* Barra Flotante de Carrito */}
          {totalItemsCount > 0 && !isCartOpen && !orderSubmitted && (
            <div className="fixed bottom-5 left-4 right-4 max-w-xl mx-auto z-40">
              <button
                onClick={() => setIsCartOpen(true)}
                className="w-full bg-brand-charcoal hover:bg-black text-white p-4 rounded-3xl shadow-xl flex justify-between items-center transition-all active:scale-[0.99] border border-white/10"
              >
                <div className="flex items-center space-x-2.5">
                  <span className="w-6 h-6 rounded-full bg-brand-pink text-white text-xs font-black flex items-center justify-center">
                    {totalItemsCount}
                  </span>
                  <span className="text-xs font-bold uppercase tracking-wider">Ver mi pedido</span>
                </div>
                <span className="text-base font-black">{formatRD(cartSubtotal)} →</span>
              </button>
            </div>
          )}

          {/* MODAL / PANTALLA DE CHECKOUT */}
          {isCartOpen && !orderSubmitted && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[92vh] overflow-y-auto p-5 space-y-4 shadow-2xl animate-in slide-in-from-bottom duration-200">
                
                <div className="flex justify-between items-center border-b border-brand-border pb-3">
                  <div>
                    <h2 className="text-base font-bold text-brand-charcoal">Completar Pedido</h2>
                    <span className="text-[11px] text-gray-400">LeRoss Bakery · Santo Domingo Este</span>
                  </div>
                  <button
                    onClick={() => setIsCartOpen(false)}
                    className="w-7 h-7 rounded-full bg-brand-softBg text-gray-500 font-bold flex items-center justify-center text-xs"
                  >
                    ✕
                  </button>
                </div>

                {/* Resumen de Postres en Carrito */}
                <div className="divide-y divide-brand-border/60">
                  {cartItems.map(it => (
                    <div key={it.product.id} className="py-2.5 flex justify-between items-center text-xs">
                      <div>
                        <span className="font-bold text-brand-charcoal">{it.product.name}</span>
                        <span className="text-gray-400 block text-[11px]">{it.quantity} x {formatRD(it.product.price)}</span>
                      </div>
                      <div className="flex items-center space-x-2">
                        <span className="font-extrabold text-brand-charcoal">{formatRD(it.product.price * it.quantity)}</span>
                        <div className="flex items-center space-x-1 bg-brand-softBg border border-brand-border rounded-lg p-0.5">
                          <button onClick={() => updateQuantity(it.product.id, -1)} className="w-5 h-5 bg-white rounded text-xs font-bold">-</button>
                          <span className="text-[11px] font-bold px-1">{it.quantity}</span>
                          <button onClick={() => updateQuantity(it.product.id, 1)} className="w-5 h-5 bg-brand-pink text-white rounded text-xs font-bold">+</button>
                        </div>
                      </div>
                    </div>
                  ))}
                  <div className="pt-2 flex justify-between items-baseline font-black text-sm text-brand-charcoal">
                    <span>Total Estimado:</span>
                    <span className="text-base text-brand-darkPink">{formatRD(cartSubtotal)}</span>
                  </div>
                </div>

                {/* Formulario de Entrega & Contacto */}
                <form onSubmit={handleSubmitOrder} className="space-y-3 pt-2">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] font-semibold text-gray-500 block mb-1">Tu Nombre *</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej. Laura Gómez"
                        value={customerName}
                        onChange={e => setCustomerName(e.target.value)}
                        className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:border-brand-pink"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-semibold text-gray-500 block mb-1">WhatsApp *</label>
                      <input
                        type="tel"
                        required
                        placeholder="809-000-0000"
                        value={customerPhone}
                        onChange={e => setCustomerPhone(e.target.value)}
                        className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:border-brand-pink"
                      />
                    </div>
                  </div>

                  {/* Modalidad de Entrega */}
                  <div>
                    <label className="text-[11px] font-semibold text-gray-500 block mb-1">Tipo de Entrega</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setDeliveryType("Pickup")}
                        className={`py-2 text-xs font-bold rounded-xl border transition-all ${
                          deliveryType === "Pickup"
                            ? "bg-brand-charcoal text-white border-brand-charcoal"
                            : "bg-brand-softBg text-gray-600 border-brand-border"
                        }`}
                      >
                        🚗 Retiro (SDE)
                      </button>
                      <button
                        type="button"
                        onClick={() => setDeliveryType("Delivery")}
                        className={`py-2 text-xs font-bold rounded-xl border transition-all ${
                          deliveryType === "Delivery"
                            ? "bg-brand-charcoal text-white border-brand-charcoal"
                            : "bg-brand-softBg text-gray-600 border-brand-border"
                        }`}
                      >
                        🛵 Envío a Domicilio
                      </button>
                    </div>
                  </div>

                  {deliveryType === "Delivery" && (
                    <div>
                      <label className="text-[11px] font-semibold text-gray-500 block mb-1">Dirección de Entrega</label>
                      <input
                        type="text"
                        required
                        placeholder="Sector, calle, número de casa/apto"
                        value={deliveryAddress}
                        onChange={e => setDeliveryAddress(e.target.value)}
                        className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none focus:border-brand-pink"
                      />
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] font-semibold text-gray-500 block mb-1">Fecha de Entrega *</label>
                      <input
                        type="date"
                        required
                        value={deliveryDate}
                        onChange={e => setDeliveryDate(e.target.value)}
                        className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none focus:border-brand-pink"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-semibold text-gray-500 block mb-1">Hora Estimada</label>
                      <input
                        type="time"
                        value={deliveryTime}
                        onChange={e => setDeliveryTime(e.target.value)}
                        className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none focus:border-brand-pink"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-gray-500 block mb-1">Nota Especial / Dedicatoria</label>
                    <textarea
                      rows="2"
                      placeholder="Ej. Escribir 'Felicidades Mamá', lazo de color especial..."
                      value={specialNotes}
                      onChange={e => setSpecialNotes(e.target.value)}
                      className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none focus:border-brand-pink"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg active:scale-[0.99] transition-all flex items-center justify-center space-x-2 text-sm"
                  >
                    <span>💬</span>
                    <span>{isSubmitting ? "Procesando..." : "Confirmar por WhatsApp"}</span>
                  </button>
                </form>

              </div>
            </div>
          )}

          {/* PANTALLA FINAL: CONFIRMACIÓN Y BOTÓN WHATSAPP */}
          {orderSubmitted && (
            <div className="fixed inset-0 z-50 bg-brand-softBg flex items-center justify-center p-5">
              <div className="bg-white w-full max-w-md p-6 rounded-3xl border border-brand-border text-center space-y-4 shadow-xl animate-in zoom-in-95 duration-200">
                <div className="w-16 h-16 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl">
                  ✓
                </div>
                <h2 className="text-xl font-black text-brand-charcoal">¡Pedido Casi Listo!</h2>
                <p className="text-xs text-gray-500 leading-relaxed">
                  Para apartar tu fecha y coordinar el pago, pulsa el botón abajo para enviar el detalle de tu orden directamente a nuestro WhatsApp oficial:
                </p>

                <a
                  href={whatsAppUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg flex items-center justify-center space-x-2 text-sm transition-all block"
                >
                  <span>📲 Abrir WhatsApp con LeRoss Bakery</span>
                </a>

                <button
                  onClick={() => {
                    setOrderSubmitted(false);
                    setIsCartOpen(false);
                    setCart({});
                  }}
                  className="text-xs text-gray-400 font-semibold hover:text-brand-charcoal pt-2"
                >
                  Volver al menú principal
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<MenuApp />);
  </script>
</body>
</html>
