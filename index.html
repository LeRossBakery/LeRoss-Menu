<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LeRoss Bakery — Facturación</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LeRoss">
  <link rel="apple-touch-icon" href="https://img.icons8.com/cotton/128/cupcake--v1.png">

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#E5839B',
              darkPink: '#D46B84',
              softBg: '#FAF4F6',
              charcoal: '#1E1E1E',
              border: '#F0E2E7'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: auto;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        background: white !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-brand-softBg text-brand-charcoal min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'leross_app_data_v2';
    const safeStorage = {
      get: () => {
        try {
          const item = (window.storage || window.localStorage).getItem(STORAGE_KEY);
          return item ? JSON.parse(item) : null;
        } catch (e) {
          console.error("Error al leer storage", e);
          return null;
        }
      },
      set: (data) => {
        try {
          (window.storage || window.localStorage).setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error("Error al guardar en storage", e);
        }
      }
    };

    const formatRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formatDate = (dateStr) => {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      return `${d}/${m}/${y}`;
    };

    const copyToClipboard = (text) => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
      } catch (err) {}
      document.body.removeChild(textArea);
      return Promise.resolve();
    };

    function App() {
      const [tab, setTab] = useState("invoices");
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");
      const [toastMsg, setToastMsg] = useState("");

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3000);
      };

      const [state, setState] = useState(() => {
        const saved = safeStorage.get();
        return saved || {
          counter: 1,
          hasIssuedFirst: false,
          prefix: "FAC-",
          business: {
            name: "LeRoss Bakery",
            phone: "829-000-0000",
            address: "Santo Domingo, D.N.",
            email: "contacto@lerossbakery.com",
            instagram: "@lerossbakery",
            rnc: "",
            footerMsg: "¡Gracias por endulzar tus momentos con nosotros! 🧁",
            paymentInstructions: "Banco Popular / BHD / Banreservas\nCuenta de Ahorros: 000-000000-0\nA nombre de: LeRoss Bakery\nEnviar comprobante a este WhatsApp."
          },
          taxSettings: { applyITBIS: false, defaultRate: 18 },
          products: [
            { id: "p1", name: "Flan Tradicional Mediano", price: 1200, exempt: false },
            { id: "p2", name: "Caja Mini Brownies (12 uds)", price: 650, exempt: false },
            { id: "p3", name: "Tres Leches Familiar", price: 1500, exempt: false },
            { id: "p4", name: "Pudín Tradicional Decorado", price: 2200, exempt: false }
          ],
          customers: [
            { id: "c1", name: "Cliente General", phone: "", rnc: "" }
          ],
          invoices: [],
          drafts: []
        };
      });

      useEffect(() => {
        safeStorage.set(state);
      }, [state]);

      const [currentDraftId, setCurrentDraftId] = useState(null);
      const [draft, setDraft] = useState({
        customerName: "",
        customerPhone: "",
        date: new Date().toISOString().split("T")[0],
        deliveryDate: "",
        items: [{ id: 1, name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }],
        orderDiscountType: "amount",
        orderDiscountVal: 0,
        paymentStatus: "Pendiente",
        paymentMethod: "Transferencia",
        notes: ""
      });

      const calculation = useMemo(() => {
        let subtotal = 0;
        let taxableSubtotal = 0;

        const calculatedLines = draft.items.map(item => {
          const raw = Number(item.quantity || 0) * Number(item.unitPrice || 0);
          let disc = 0;
          if (item.discountType === "percent") {
            disc = raw * (Number(item.discountVal || 0) / 100);
          } else {
            disc = Number(item.discountVal || 0);
          }
          disc = Math.min(raw, Math.max(0, disc));
          const lineTotal = raw - disc;
          subtotal += lineTotal;
          if (!item.exempt) taxableSubtotal += lineTotal;
          return { ...item, lineSubtotal: raw, lineDiscount: disc, lineTotal };
        });

        let orderDisc = 0;
        if (draft.orderDiscountType === "percent") {
          orderDisc = subtotal * (Number(draft.orderDiscountVal || 0) / 100);
        } else {
          orderDisc = Number(draft.orderDiscountVal || 0);
        }
        orderDisc = Math.min(subtotal, Math.max(0, orderDisc));
        const discountedSubtotal = subtotal - orderDisc;

        const effectiveTaxableRatio = subtotal > 0 ? (taxableSubtotal / subtotal) : 0;
        const finalTaxableBase = discountedSubtotal * effectiveTaxableRatio;
        
        const itbis = state.taxSettings.applyITBIS ? (finalTaxableBase * (state.taxSettings.defaultRate / 100)) : 0;
        const total = discountedSubtotal + itbis;

        return { lines: calculatedLines, subtotal, orderDiscount: orderDisc, discountedSubtotal, itbis, total };
      }, [draft, state.taxSettings]);

      const resetDraft = () => {
        setCurrentDraftId(null);
        setDraft({
          customerName: "",
          customerPhone: "",
          date: new Date().toISOString().split("T")[0],
          deliveryDate: "",
          items: [{ id: Date.now(), name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }],
          orderDiscountType: "amount",
          orderDiscountVal: 0,
          paymentStatus: "Pendiente",
          paymentMethod: "Transferencia",
          notes: ""
        });
      };

      const saveDraftRecord = () => {
        if (!draft.customerName.trim()) {
          alert("Indique el nombre del cliente para guardar el borrador.");
          return;
        }
        const draftId = currentDraftId || ("draft_" + Date.now());
        const draftRecord = { ...draft, id: draftId, state: "Borrador", calculation, updatedAt: new Date().toISOString() };
        
        setState(prev => {
          const filtered = (prev.drafts || []).filter(d => d.id !== draftId);
          return { ...prev, drafts: [draftRecord, ...filtered] };
        });
        showToast("Borrador guardado correctamente");
      };

      const emitInvoice = () => {
        if (!draft.customerName.trim()) {
          alert("Por favor indique el nombre del cliente");
          return;
        }
        if (calculation.total <= 0) {
          alert("La factura debe tener un monto mayor a RD$ 0");
          return;
        }

        const invoiceNumber = `${state.prefix}${String(state.counter).padStart(4, "0")}`;
        const newInvoice = {
          ...draft,
          id: "inv_" + Date.now(),
          number: invoiceNumber,
          state: "Emitida",
          calculation,
          createdAt: new Date().toISOString()
        };

        setState(prev => {
          const filteredDrafts = (prev.drafts || []).filter(d => d.id !== currentDraftId);
          return {
            ...prev,
            counter: prev.counter + 1,
            hasIssuedFirst: true,
            invoices: [newInvoice, ...prev.invoices],
            drafts: filteredDrafts
          };
        });

        setSelectedInvoice(newInvoice);
        setTab("view");
        showToast(`Factura ${invoiceNumber} emitida con éxito`);
      };

      const voidInvoice = (invId) => {
        if (!confirm("¿Está seguro de anular esta factura? El número quedará registrado como ANULADA.")) return;
        setState(prev => ({
          ...prev,
          invoices: prev.invoices.map(inv => inv.id === invId ? { ...inv, state: "Anulada" } : inv)
        }));
        if (selectedInvoice && selectedInvoice.id === invId) {
          setSelectedInvoice(prev => ({ ...prev, state: "Anulada" }));
        }
        showToast("Factura marcada como ANULADA");
      };

      const markAsPaid = (invId) => {
        setState(prev => ({
          ...prev,
          invoices: prev.invoices.map(inv => inv.id === invId ? { ...inv, paymentStatus: "Pagada" } : inv)
        }));
        if (selectedInvoice && selectedInvoice.id === invId) {
          setSelectedInvoice(prev => ({ ...prev, paymentStatus: "Pagada" }));
        }
        showToast("Factura actualizada a PAGADA");
      };

      const shareWhatsApp = (inv) => {
        const cleanPhone = (inv.customerPhone || "").replace(/\D/g, "");
        let targetPhone = "";
        if (cleanPhone.length === 10) {
          targetPhone = "1" + cleanPhone;
        } else if (cleanPhone.length === 11 && cleanPhone.startsWith("1")) {
          targetPhone = cleanPhone;
        }

        let itemsText = inv.calculation.lines.map(l => `• ${l.quantity}x ${l.name} — ${formatRD(l.lineTotal)}`).join("\n");
        const message = `🧁 *${state.business.name}*\n` +
          `Factura: *${inv.number}*\n` +
          `Fecha: ${formatDate(inv.date)}\n` +
          `Cliente: *${inv.customerName}*\n\n` +
          `📋 *Detalle del Pedido:*\n${itemsText}\n\n` +
          `*Total: ${formatRD(inv.calculation.total)}*\n` +
          `*Estado:* ${inv.paymentStatus === 'Pagada' ? '✅ Pagada' : '⏳ Pendiente'}\n` +
          (inv.paymentStatus === 'Pendiente' ? `\n💳 *Datos de Pago:*\n${state.business.paymentInstructions}\n` : '') +
          `\n${state.business.footerMsg}`;

        const url = targetPhone 
          ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`
          : `https://wa.me/?text=${encodeURIComponent(message)}`;
        
        window.open(url, "_blank");
      };

      const copyBankDetails = () => {
        copyToClipboard(state.business.paymentInstructions).then(() => {
          showToast("Datos bancarios copiados al portapapeles");
        });
      };

      const exportBackupJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `leross_respaldo_${new Date().toISOString().split("T")[0]}.json`);
        a.click();
        showToast("Copia de seguridad descargada");
      };

      const importBackupJSON = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed && parsed.invoices) {
              setState(parsed);
              showToast("Datos restaurados exitosamente");
            } else {
              alert("Archivo JSON no válido.");
            }
          } catch (err) {
            alert("Error al procesar el archivo.");
          }
        };
        reader.readAsText(file);
      };

      const metrics = useMemo(() => {
        const active = state.invoices.filter(i => i.state !== "Anulada");
        const totalMonth = active.reduce((acc, i) => acc + i.calculation.total, 0);
        const pending = active.filter(i => i.paymentStatus === "Pendiente").reduce((acc, i) => acc + i.calculation.total, 0);
        return { totalMonth, pending };
      }, [state.invoices]);

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-xl relative pb-20">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-brand-charcoal text-white text-xs px-4 py-2 rounded-full shadow-lg transition-all">
              {toastMsg}
            </div>
          )}

          {/* Header */}
          <header className="no-print bg-white border-b border-brand-border px-5 py-4 flex items-center justify-between sticky top-0 z-20">
            <div className="flex items-center space-x-2.5">
              <div className="w-8 h-8 rounded-full bg-brand-pink flex items-center justify-center text-white font-bold text-xs shadow-sm">
                LR
              </div>
              <div>
                <span className="font-semibold text-sm tracking-tight block">{state.business.name}</span>
                <span className="text-[10px] text-gray-400">Facturación & Pedidos</span>
              </div>
            </div>
            {tab === "view" ? (
              <button onClick={() => setTab("invoices")} className="text-xs bg-brand-softBg px-3 py-1.5 rounded-full font-medium text-brand-darkPink">
                ← Volver
              </button>
            ) : (
              <button onClick={copyBankDetails} className="text-[11px] bg-brand-softBg text-brand-darkPink px-2.5 py-1 rounded-full font-semibold border border-brand-border">
                💳 Copiar Banco
              </button>
            )}
          </header>

          {/* MAIN BODY */}
          <main className="flex-1 p-4 overflow-y-auto">
            
            {/* VIEW 1: INVOICES HISTORY */}
            {tab === "invoices" && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-brand-softBg p-3.5 rounded-2xl border border-brand-border">
                    <span className="text-[11px] font-medium text-gray-500 uppercase tracking-wider block">Facturado</span>
                    <span className="text-lg font-bold text-brand-charcoal">{formatRD(metrics.totalMonth)}</span>
                  </div>
                  <div className="bg-rose-50/50 p-3.5 rounded-2xl border border-rose-100">
                    <span className="text-[11px] font-medium text-rose-500 uppercase tracking-wider block">Por Cobrar</span>
                    <span className="text-lg font-bold text-rose-600">{formatRD(metrics.pending)}</span>
                  </div>
                </div>

                <div className="flex space-x-2">
                  <input
                    type="text"
                    placeholder="Buscar cliente o factura..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="flex-1 text-sm bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 outline-none focus:border-brand-pink"
                  />
                  <select
                    value={statusFilter}
                    onChange={e => setStatusFilter(e.target.value)}
                    className="text-xs bg-brand-softBg border border-brand-border rounded-xl px-2.5 outline-none font-medium"
                  >
                    <option value="all">Todas</option>
                    <option value="Pendiente">Pendientes</option>
                    <option value="Pagada">Pagadas</option>
                    <option value="Anulada">Anuladas</option>
                  </select>
                </div>

                {/* Drafts Section if any */}
                {(state.drafts && state.drafts.length > 0) && (
                  <div className="space-y-2">
                    <span className="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Borradores Guardados</span>
                    {state.drafts.map(d => (
                      <div
                        key={d.id}
                        onClick={() => {
                          setCurrentDraftId(d.id);
                          setDraft(d);
                          setTab("new");
                        }}
                        className="p-3 bg-amber-50/60 border border-amber-200 rounded-xl flex justify-between items-center cursor-pointer"
                      >
                        <div>
                          <p className="text-xs font-bold text-amber-900">{d.customerName || "Sin cliente"}</p>
                          <p className="text-[10px] text-amber-700">{formatDate(d.date)} • {formatRD(d.calculation.total)}</p>
                        </div>
                        <span className="text-[10px] font-bold bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">Editar</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Invoices List */}
                <div className="space-y-2.5">
                  {state.invoices
                    .filter(inv => {
                      const matchesSearch = inv.customerName.toLowerCase().includes(searchQuery.toLowerCase()) || inv.number.toLowerCase().includes(searchQuery.toLowerCase());
                      const matchesStatus = statusFilter === "all" ? true : (statusFilter === "Anulada" ? inv.state === "Anulada" : inv.paymentStatus === statusFilter && inv.state !== "Anulada");
                      return matchesSearch && matchesStatus;
                    })
                    .map(inv => (
                      <div
                        key={inv.id}
                        onClick={() => { setSelectedInvoice(inv); setTab("view"); }}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer bg-white ${inv.state === 'Anulada' ? 'border-gray-200 opacity-60' : 'border-brand-border hover:shadow-sm'}`}
                      >
                        <div className="flex justify-between items-start mb-1">
                          <span className="font-semibold text-sm">{inv.number}</span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${
                            inv.state === 'Anulada' ? 'bg-gray-100 text-gray-500' :
                            inv.paymentStatus === 'Pagada' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'
                          }`}>
                            {inv.state === 'Anulada' ? 'Anulada' : inv.paymentStatus}
                          </span>
                        </div>
                        <div className="flex justify-between items-baseline mt-2">
                          <div>
                            <p className="text-sm font-medium text-brand-charcoal">{inv.customerName}</p>
                            <p className="text-[11px] text-gray-400">{formatDate(inv.date)}</p>
                          </div>
                          <span className="text-base font-bold text-brand-darkPink">{formatRD(inv.calculation.total)}</span>
                        </div>
                      </div>
                    ))}

                  {state.invoices.length === 0 && (!state.drafts || state.drafts.length === 0) && (
                    <div className="text-center py-12 text-gray-400 text-sm">
                      No hay facturas emitidas todavía.<br/>Pulsa <b>+ Nueva</b> para crear una orden.
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 2: NEW INVOICE */}
            {tab === "new" && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-base font-bold text-brand-charcoal">
                    {currentDraftId ? "Editando Borrador" : "Nueva Factura"}
                  </h2>
                  <button onClick={resetDraft} className="text-xs text-gray-400 hover:text-brand-darkPink">Limpiar</button>
                </div>
                
                {/* Client Data */}
                <div className="bg-brand-softBg p-3.5 rounded-2xl border border-brand-border space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-gray-500 block mb-1">Cliente</label>
                    <input
                      type="text"
                      placeholder="Nombre del cliente"
                      value={draft.customerName}
                      onChange={e => setDraft({ ...draft, customerName: e.target.value })}
                      className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-pink"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-semibold text-gray-500 block mb-1">Teléfono (WhatsApp)</label>
                      <input
                        type="tel"
                        placeholder="809-000-0000"
                        value={draft.customerPhone}
                        onChange={e => setDraft({ ...draft, customerPhone: e.target.value })}
                        className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 text-sm outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-500 block mb-1">Fecha</label>
                      <input
                        type="date"
                        value={draft.date}
                        onChange={e => setDraft({ ...draft, date: e.target.value })}
                        className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 text-sm outline-none"
                      />
                    </div>
                  </div>
                </div>

                {/* Items */}
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-brand-charcoal uppercase tracking-wider">Productos / Postres</label>
                    <button
                      type="button"
                      onClick={() => setDraft({
                        ...draft,
                        items: [...draft.items, { id: Date.now(), name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }]
                      })}
                      className="text-xs text-brand-darkPink font-semibold hover:underline"
                    >
                      + Añadir línea
                    </button>
                  </div>

                  {draft.items.map((item, idx) => (
                    <div key={item.id} className="p-3 bg-brand-softBg rounded-2xl border border-brand-border space-y-2">
                      <div className="flex space-x-2">
                        <select
                          className="flex-1 bg-white border border-brand-border rounded-xl px-2.5 py-1.5 text-xs outline-none"
                          onChange={(e) => {
                            const prod = state.products.find(p => p.id === e.target.value);
                            if (prod) {
                              const updated = [...draft.items];
                              updated[idx].name = prod.name;
                              updated[idx].unitPrice = prod.price;
                              updated[idx].exempt = prod.exempt;
                              setDraft({ ...draft, items: updated });
                            }
                          }}
                        >
                          <option value="">Seleccionar del catálogo...</option>
                          {state.products.map(p => (
                            <option key={p.id} value={p.id}>{p.name} ({formatRD(p.price)})</option>
                          ))}
                        </select>
                        <button
                          onClick={() => {
                            if (draft.items.length > 1) {
                              setDraft({ ...draft, items: draft.items.filter((_, i) => i !== idx) });
                            }
                          }}
                          className="text-gray-400 hover:text-rose-500 text-xs px-2"
                        >
                          ✕
                        </button>
                      </div>

                      <input
                        type="text"
                        placeholder="Descripción o detalle especial"
                        value={item.name}
                        onChange={e => {
                          const updated = [...draft.items];
                          updated[idx].name = e.target.value;
                          setDraft({ ...draft, items: updated });
                        }}
                        className="w-full bg-white border border-brand-border rounded-xl px-3 py-1.5 text-xs outline-none"
                      />

                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <span className="text-[10px] text-gray-400 block">Cant.</span>
                          <input
                            type="number"
                            min="1"
                            value={item.quantity}
                            onChange={e => {
                              const updated = [...draft.items];
                              updated[idx].quantity = Number(e.target.value);
                              setDraft({ ...draft, items: updated });
                            }}
                            className="w-full bg-white border border-brand-border rounded-xl px-2 py-1 text-xs text-center outline-none"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-gray-400 block">Precio RD$</span>
                          <input
                            type="number"
                            value={item.unitPrice}
                            onChange={e => {
                              const updated = [...draft.items];
                              updated[idx].unitPrice = Number(e.target.value);
                              setDraft({ ...draft, items: updated });
                            }}
                            className="w-full bg-white border border-brand-border rounded-xl px-2 py-1 text-xs text-center outline-none"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-gray-400 block">Total</span>
                          <div className="text-xs font-semibold py-1.5 text-right text-brand-darkPink">
                            {formatRD((item.quantity || 0) * (item.unitPrice || 0))}
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Payment Options */}
                <div className="bg-brand-softBg p-3.5 rounded-2xl border border-brand-border grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs font-semibold text-gray-500 block mb-1">Estado</label>
                    <select
                      value={draft.paymentStatus}
                      onChange={e => setDraft({ ...draft, paymentStatus: e.target.value })}
                      className="w-full bg-white border border-brand-border rounded-xl px-2.5 py-1.5 text-xs font-medium outline-none"
                    >
                      <option value="Pendiente">⏳ Pendiente</option>
                      <option value="Pagada">✅ Pagada</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-500 block mb-1">Método</label>
                    <select
                      value={draft.paymentMethod}
                      onChange={e => setDraft({ ...draft, paymentMethod: e.target.value })}
                      className="w-full bg-white border border-brand-border rounded-xl px-2.5 py-1.5 text-xs font-medium outline-none"
                    >
                      <option value="Transferencia">Transferencia</option>
                      <option value="Efectivo">Efectivo</option>
                      <option value="Tarjeta">Tarjeta</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>
                </div>

                {/* Calculation Block */}
                <div className="p-4 bg-brand-softBg rounded-2xl border border-brand-border space-y-1.5">
                  <div className="flex justify-between text-xs text-gray-500">
                    <span>Subtotal</span>
                    <span>{formatRD(calculation.subtotal)}</span>
                  </div>
                  {state.taxSettings.applyITBIS && (
                    <div className="flex justify-between text-xs text-gray-500">
                      <span>ITBIS ({state.taxSettings.defaultRate}%)</span>
                      <span>{formatRD(calculation.itbis)}</span>
                    </div>
                  )}
                  <div className="flex justify-between text-base font-bold text-brand-charcoal pt-2 border-t border-brand-border">
                    <span>Total Final</span>
                    <span className="text-brand-darkPink">{formatRD(calculation.total)}</span>
                  </div>
                </div>

                {/* Action Buttons: Save Draft or Issue */}
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={saveDraftRecord}
                    className="bg-brand-softBg hover:bg-rose-100 text-brand-darkPink font-semibold py-3.5 rounded-2xl border border-brand-border transition-all text-xs"
                  >
                    Guardar Borrador
                  </button>
                  <button
                    type="button"
                    onClick={emitInvoice}
                    className="bg-brand-pink hover:bg-brand-darkPink text-white font-bold py-3.5 rounded-2xl shadow-md transition-all active:scale-[0.99] text-xs"
                  >
                    Emitir Factura
                  </button>
                </div>
              </div>
            )}

            {/* VIEW 3: INVOICE DETAIL & PRINT */}
            {tab === "view" && selectedInvoice && (
              <div className="space-y-4">
                <div className="no-print flex space-x-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 bg-brand-charcoal text-white font-medium py-2.5 rounded-xl text-xs flex items-center justify-center space-x-1"
                  >
                    <span>🖨 Imprimir / PDF</span>
                  </button>
                  <button
                    onClick={() => shareWhatsApp(selectedInvoice)}
                    className="flex-1 bg-emerald-600 text-white font-medium py-2.5 rounded-xl text-xs flex items-center justify-center space-x-1"
                  >
                    <span>💬 WhatsApp</span>
                  </button>
                </div>

                {/* Printable Invoice */}
                <div id="print-area" className="bg-white p-6 rounded-2xl border border-brand-border shadow-sm space-y-5 text-brand-charcoal">
                  <div className="flex justify-between items-start border-b border-brand-border pb-4">
                    <div>
                      <h1 className="font-serif text-2xl font-bold text-brand-darkPink">{state.business.name}</h1>
                      <p className="text-xs text-gray-500">{state.business.address}</p>
                      <p className="text-xs text-gray-500">{state.business.phone}</p>
                      {state.business.instagram && <p className="text-xs text-gray-400">{state.business.instagram}</p>}
                    </div>
                    <div className="text-right">
                      <span className="text-xs font-bold uppercase tracking-wider text-gray-400 block">Factura</span>
                      <span className="text-base font-bold">{selectedInvoice.number}</span>
                      <p className="text-xs text-gray-400">{formatDate(selectedInvoice.date)}</p>
                    </div>
                  </div>

                  <div className="bg-brand-softBg p-3 rounded-xl text-xs space-y-0.5">
                    <span className="text-gray-400 uppercase tracking-wider text-[10px] block font-bold">Cliente</span>
                    <p className="font-bold text-sm">{selectedInvoice.customerName}</p>
                    {selectedInvoice.customerPhone && <p className="text-gray-500">{selectedInvoice.customerPhone}</p>}
                  </div>

                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b border-brand-border text-gray-400 text-[10px] uppercase font-bold text-left">
                        <th className="py-1">Descripción</th>
                        <th className="py-1 text-center">Cant.</th>
                        <th className="py-1 text-right">Precio</th>
                        <th className="py-1 text-right">Total</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-brand-softBg">
                      {selectedInvoice.calculation.lines.map((l, i) => (
                        <tr key={i}>
                          <td className="py-2 font-medium">{l.name}</td>
                          <td className="py-2 text-center text-gray-500">{l.quantity}</td>
                          <td className="py-2 text-right text-gray-500">{formatRD(l.unitPrice)}</td>
                          <td className="py-2 text-right font-semibold">{formatRD(l.lineTotal)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="border-t border-brand-border pt-3 space-y-1 text-xs">
                    <div className="flex justify-between text-gray-500">
                      <span>Subtotal</span>
                      <span>{formatRD(selectedInvoice.calculation.subtotal)}</span>
                    </div>
                    {state.taxSettings.applyITBIS && (
                      <div className="flex justify-between text-gray-500">
                        <span>ITBIS</span>
                        <span>{formatRD(selectedInvoice.calculation.itbis)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-base font-bold text-brand-darkPink pt-1">
                      <span>Total</span>
                      <span>{formatRD(selectedInvoice.calculation.total)}</span>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-brand-border text-xs space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-gray-400">Estado del pago:</span>
                      <span className="font-bold">{selectedInvoice.paymentStatus} ({selectedInvoice.paymentMethod})</span>
                    </div>
                    {selectedInvoice.paymentStatus === 'Pendiente' && state.business.paymentInstructions && (
                      <div className="p-2.5 bg-brand-softBg rounded-xl text-[11px] whitespace-pre-line text-gray-600">
                        {state.business.paymentInstructions}
                      </div>
                    )}
                    <p className="text-center text-gray-400 text-[11px] italic pt-2">{state.business.footerMsg}</p>
                  </div>

                  {selectedInvoice.state === "Anulada" && (
                    <div className="p-2 text-center bg-rose-50 text-rose-600 font-bold rounded-xl text-xs uppercase tracking-wider">
                      Factura Anulada
                    </div>
                  )}
                </div>

                <div className="no-print flex space-x-2 pt-2">
                  {selectedInvoice.state !== "Anulada" && (
                    <>
                      {selectedInvoice.paymentStatus === "Pendiente" && (
                        <button
                          onClick={() => markAsPaid(selectedInvoice.id)}
                          className="flex-1 bg-emerald-50 text-emerald-600 py-2.5 rounded-xl text-xs font-semibold border border-emerald-200"
                        >
                          Marcar como Pagada
                        </button>
                      )}
                      <button
                        onClick={() => voidInvoice(selectedInvoice.id)}
                        className="text-xs text-rose-500 py-2.5 px-4 rounded-xl border border-rose-200 hover:bg-rose-50 font-semibold"
                      >
                        Anular Factura
                      </button>
                    </>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 4: PRODUCTS */}
            {tab === "products" && (
              <div className="space-y-4">
                <h2 className="text-base font-bold text-brand-charcoal">Catálogo de Postres</h2>
                <div className="space-y-2">
                  {state.products.map(p => (
                    <div key={p.id} className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border flex justify-between items-center">
                      <div>
                        <span className="font-semibold text-sm block">{p.name}</span>
                        <span className="text-xs font-bold text-brand-darkPink">{formatRD(p.price)}</span>
                      </div>
                      <button
                        onClick={() => setState(prev => ({ ...prev, products: prev.products.filter(item => item.id !== p.id) }))}
                        className="text-gray-400 hover:text-rose-500 text-xs px-2"
                      >
                        Eliminar
                      </button>
                    </div>
                  ))}
                </div>
                
                <div className="p-3.5 bg-white border border-brand-border rounded-2xl space-y-2">
                  <span className="text-xs font-bold text-brand-charcoal block">Nuevo Producto</span>
                  <input id="new-prod-name" placeholder="Ej. Tarta de Fresa" className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none" />
                  <input id="new-prod-price" type="number" placeholder="Precio en RD$" className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none" />
                  <button
                    onClick={() => {
                      const name = document.getElementById("new-prod-name").value;
                      const price = Number(document.getElementById("new-prod-price").value);
                      if (name && price) {
                        setState(prev => ({
                          ...prev,
                          products: [...prev.products, { id: "p_" + Date.now(), name, price, exempt: false }]
                        }));
                        document.getElementById("new-prod-name").value = "";
                        document.getElementById("new-prod-price").value = "";
                        showToast("Producto agregado al catálogo");
                      }
                    }}
                    className="w-full bg-brand-pink text-white text-xs font-bold py-2 rounded-xl"
                  >
                    Guardar en Catálogo
                  </button>
                </div>
              </div>
            )}

            {/* VIEW 5: SETTINGS */}
            {tab === "settings" && (
              <div className="space-y-4 text-xs">
                <h2 className="text-base font-bold text-brand-charcoal">Ajustes del Negocio</h2>
                
                <div className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border space-y-2">
                  <label className="font-bold text-gray-500 block">Nombre del Negocio</label>
                  <input
                    value={state.business.name}
                    onChange={e => setState({ ...state, business: { ...state.business, name: e.target.value } })}
                    className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 outline-none"
                  />
                  <label className="font-bold text-gray-500 block">Teléfono / WhatsApp</label>
                  <input
                    value={state.business.phone}
                    onChange={e => setState({ ...state, business: { ...state.business, phone: e.target.value } })}
                    className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 outline-none"
                  />
                  <label className="font-bold text-gray-500 block">Datos Bancarios para Transferencia</label>
                  <textarea
                    rows="3"
                    value={state.business.paymentInstructions}
                    onChange={e => setState({ ...state, business: { ...state.business, paymentInstructions: e.target.value } })}
                    className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 outline-none text-xs"
                  />
                </div>

                <div className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border space-y-2">
                  <span className="font-bold text-gray-500 block">Numeración de Facturas</span>
                  <div className="flex space-x-2">
                    <input
                      disabled={state.hasIssuedFirst}
                      value={state.prefix}
                      onChange={e => setState({ ...state, prefix: e.target.value })}
                      placeholder="FAC-"
                      className="w-1/2 bg-white border border-brand-border rounded-xl px-3 py-2 outline-none disabled:bg-gray-100"
                    />
                    <input
                      type="number"
                      disabled={state.hasIssuedFirst}
                      value={state.counter}
                      onChange={e => setState({ ...state, counter: Number(e.target.value) })}
                      className="w-1/2 bg-white border border-brand-border rounded-xl px-3 py-2 outline-none disabled:bg-gray-100"
                    />
                  </div>
                  {state.hasIssuedFirst && (
                    <span className="text-[10px] text-gray-400 block">La numeración secuencial está activa y protegida contra saltos.</span>
                  )}
                </div>

                <div className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border space-y-2">
                  <span className="font-bold text-gray-500 block">Copia de Seguridad y Transferencia</span>
                  <button
                    onClick={exportBackupJSON}
                    className="w-full bg-white text-gray-700 font-bold py-2 rounded-xl border border-brand-border text-xs"
                  >
                    Descargar Respaldo (JSON)
                  </button>
                  <label className="w-full bg-white text-gray-700 font-bold py-2 rounded-xl border border-brand-border text-xs flex items-center justify-center cursor-pointer">
                    <span>Restaurar desde Respaldo (JSON)</span>
                    <input type="file" accept=".json" onChange={importBackupJSON} className="hidden" />
                  </label>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Tabs */}
          <nav className="no-print bg-white/95 backdrop-blur-md border-t border-brand-border flex justify-around py-3 absolute bottom-0 left-0 right-0 z-30">
            <button
              onClick={() => setTab("invoices")}
              className={`flex flex-col items-center text-[10px] font-semibold ${tab === 'invoices' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">📋</span>
              Facturas
            </button>
            <button
              onClick={() => {
                resetDraft();
                setTab("new");
              }}
              className={`flex flex-col items-center text-[10px] font-semibold ${tab === 'new' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">➕</span>
              Nueva
            </button>
            <button
              onClick={() => setTab("products")}
              className={`flex flex-col items-center text-[10px] font-semibold ${tab === 'products' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">🧁</span>
              Postres
            </button>
            <button
              onClick={() => setTab("settings")}
              className={`flex flex-col items-center text-[10px] font-semibold ${tab === 'settings' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">⚙️</span>
              Ajustes
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
